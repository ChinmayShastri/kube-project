apiVersion: v1
kind: Service
metadata:
  name: {{ include "app-chart.fullname" . }}-frontend-svc
  labels:
    app: {{ include "app-chart.name" . }}
    component: frontend
spec:
  type: {{ .Values.service.frontend.type | default "LoadBalancer" }}
  selector:
    app: {{ include "app-chart.name" . }}
    component: frontend
  ports:
  - port: 80
    targetPort: {{ .Values.frontend.port }}
    name: http
