apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app-chart.fullname" . }}-frontend-nginx-conf
  labels:
    app: {{ include "app-chart.name" . }}
    component: frontend
data:
  default.conf: |
    server {
      listen 80;
      server_name _;

      location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
      }

      # Proxy /api-proxy/* to backend /api/*
      location /api-proxy/ {
        rewrite ^/api-proxy/(.*)$ /api/$1 break;

        proxy_pass http://{{ include "app-chart.fullname" . }}-backend-svc.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.backend.port }};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 90;
      }
    }