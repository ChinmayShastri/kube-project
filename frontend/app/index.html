<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>POC Frontend</title>
</head>
<body>
  <h1>POC Frontend</h1>
  <div id="out">Loading...</div>
  <script>
    async function fetchMessage(){
      try {
        // backend service name: backend-svc (see Helm values)
        const res = await fetch('/api-proxy/message');
        const j = await res.json();
        document.getElementById('out').innerText = JSON.stringify(j);
      } catch(e){
        document.getElementById('out').innerText = 'Error: ' + e;
      }
    }
    fetchMessage();
    setInterval(fetchMessage, 5000);
  </script>
</body>
</html>
